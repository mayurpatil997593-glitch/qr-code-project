{% extends "base.html" %}{% block title %}Login | QR Shield{% endblock %}
{% block content %}
<div class="auth-wrap"><form class="panel auth-card" method="post">
  <div class="eyebrow">WELCOME BACK</div><h1>Sign in</h1><p class="muted">Access your QR security dashboard.</p>
  <label>Email address<input type="email" name="email" required autocomplete="email"></label>
  <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn primary full" type="submit">Login securely →</button>
  <p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form></div>
{% endblock %}
